<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>병 플립 대모험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#22223b; --panel:#eaf6ff; --card:#ffffff; --line:#22223b; --shadow:#22223b;
  --sun:#ffd23f; --pink:#ee4266; --mint:#3bceac; --sky:#4d9de0; --muted:#5c5f7a;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  background:#22223b;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --panel:#23253d; --card:#2e3150; --ink:#f3f1ff; --muted:#b8b6d6; --line:#0f1022; --shadow:#0f1022; }
}
:root[data-theme="dark"]{ --panel:#23253d; --card:#2e3150; --ink:#f3f1ff; --muted:#b8b6d6; --line:#0f1022; --shadow:#0f1022; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%}
body{overflow:hidden;background:#22223b;color:var(--ink);font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;touch-action:none}
#app{position:relative;width:100%;height:100%;overflow:hidden}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
.hidden{display:none!important}

/* buttons */
.btn{font-family:'Black Han Sans','Jua',sans-serif;font-size:18px;color:#22223b;background:var(--sun);border:3px solid #22223b;border-radius:14px;padding:12px 18px;box-shadow:0 5px 0 #22223b;cursor:pointer;transition:transform .06s,box-shadow .06s;letter-spacing:.5px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #22223b}
.btn:focus-visible,.stg:focus-visible,.icon-btn:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.btn.big{font-size:24px;padding:16px 26px;width:100%}
.btn.mint{background:var(--mint)} .btn.pink{background:var(--pink);color:#fff} .btn.ghost{background:#fff}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px} .row>.btn{flex:1}
.coin-ic{display:inline-block;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,#ffc81f 55%,#d99a00);border:2px solid #9a6a00;vertical-align:-3px}

/* HUD */
#hud{position:absolute;left:0;right:0;top:0;padding:10px 12px;pointer-events:none}
.hud-row{display:flex;align-items:center;gap:8px}
.hud-row>*{pointer-events:auto}
.grow{flex:1}
.chip{background:rgba(255,255,255,.92);color:#22223b;border:3px solid #22223b;border-radius:12px;padding:5px 10px;font-size:16px;white-space:nowrap;box-shadow:0 3px 0 #22223b}
.icon-btn{width:40px;height:40px;border-radius:12px;border:3px solid #22223b;background:#fff;font-size:17px;box-shadow:0 3px 0 #22223b;cursor:pointer;color:#22223b}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #22223b}
.prog{position:relative;margin:10px 4px 0;height:10px;border-radius:6px;background:rgba(34,34,59,.35);border:2px solid #22223b}
#progFill{height:100%;width:0;border-radius:4px;background:var(--mint);transition:width .2s}
#progFlag{position:absolute;right:-6px;top:-13px;font-size:16px}

#toast{position:absolute;left:50%;top:96px;transform:translate(-50%,-10px);max-width:min(92%,460px);background:#22223b;color:#fff;border:3px solid #fff;border-radius:14px;padding:10px 16px;font-size:16px;line-height:1.4;text-align:center;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 4px 0 rgba(0,0,0,.35)}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* screens */
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
#scrTitle{align-items:center;justify-content:space-between;padding:6vh 20px 5vh}
.logo{display:flex;flex-direction:column;align-items:center;gap:6px;transform:rotate(-3deg)}
.logo .w{font-family:'Black Han Sans',sans-serif;line-height:.95;color:#fff;-webkit-text-stroke:3px #22223b;paint-order:stroke fill;text-shadow:0 6px 0 #22223b}
.logo .w1{font-size:clamp(52px,14vw,96px);background:var(--pink);padding:4px 20px 10px;border-radius:18px;border:4px solid #22223b;transform:rotate(-4deg)}
.logo .w2{font-size:clamp(44px,12vw,80px);background:var(--sky);padding:4px 20px 10px;border-radius:18px;border:4px solid #22223b;transform:rotate(3deg);margin-left:40px}
.tag{margin-top:18px;background:#fff;color:#22223b;border:3px solid #22223b;border-radius:30px;padding:6px 16px;font-size:15px;text-align:center}
.menu{width:min(100%,360px);display:flex;flex-direction:column;gap:12px}
.coinline{align-self:center;background:#fff;color:#22223b;border:3px solid #22223b;border-radius:30px;padding:6px 14px;font-size:17px}

.panel{background:var(--panel)}
.phead{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:3px solid var(--line);background:var(--card)}
.phead h2{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:24px;flex:1}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:14px 12px 30px}
.world{max-width:640px;margin:0 auto 18px;background:var(--card);border:3px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 5px 0 var(--shadow)}
.whead{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--wc);color:#22223b;border-bottom:3px solid #22223b}
.whead .em{font-size:30px}
.whead b{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:22px;display:block}
.whead small{font-size:14px;opacity:.8}
.whead .wp{margin-left:auto;background:#fff;border:2px solid #22223b;border-radius:10px;padding:2px 8px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:12px}
.stg{aspect-ratio:1;border:3px solid #22223b;border-radius:12px;background:#fff;color:#22223b;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 3px 0 #22223b;font-family:inherit}
.stg b{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:20px}
.stg .st{font-size:11px;color:#f0a500;letter-spacing:-1px}
.stg.done{background:#fff8d6}
.stg.locked{background:#d9dbe6;color:#8a8ca3;box-shadow:none;cursor:default}
.stg.cur{background:var(--sun)}

.shopgrid{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.skin{background:var(--card);border:3px solid var(--line);border-radius:16px;padding:8px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 4px 0 var(--shadow)}
.skin.on{background:#fff4c2;color:#22223b}
.skin canvas{width:110px;height:130px}
.skin .nm{font-size:16px}
.skin .btn{font-size:15px;padding:8px 10px;width:100%}

/* modal */
.modal{position:absolute;inset:0;background:rgba(20,20,40,.55);display:flex;align-items:center;justify-content:center;padding:18px}
.card{width:min(100%,380px);background:var(--card);color:var(--ink);border:4px solid var(--line);border-radius:22px;padding:22px 18px 18px;text-align:center;box-shadow:0 8px 0 var(--shadow);animation:pop .28s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.card .em{font-size:48px;line-height:1}
.card h3{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:28px;margin:6px 0 4px}
.card p{color:var(--muted);font-size:16px;line-height:1.45;margin-bottom:12px}
.stars{font-size:44px;letter-spacing:4px;margin:4px 0 10px;color:#cfd2e0}
.stars span{display:inline-block}
.stars .on{color:#ffc21a;-webkit-text-stroke:2px #22223b;animation:starIn .4s both}
@keyframes starIn{from{transform:scale(0) rotate(-90deg)}to{transform:none}}
.rw{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:14px;text-align:left;font-size:16px}
.rw div{display:flex;justify-content:space-between;padding:3px 0}
.rw .tot{border-top:2px dashed var(--muted);margin-top:4px;padding-top:7px;font-size:19px}
.mbtns{display:flex;flex-direction:column;gap:10px}
.who{margin-top:14px;background:#22223b;color:#fff;border:3px solid #fff;border-radius:30px;padding:6px 14px;font-size:16px;max-width:90vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#scrLogin{align-items:center;justify-content:center;gap:22px;padding:4vh 18px;overflow-y:auto;touch-action:pan-y}
#scrLogin .logo .w1{font-size:clamp(40px,11vw,70px)} #scrLogin .logo .w2{font-size:clamp(34px,9vw,60px)}
.login{animation:none;text-align:left}
.login h3{text-align:center}
.login p{text-align:center}
.inp{width:100%;font-family:'Jua',sans-serif;font-size:20px;padding:12px 14px;border:3px solid var(--line);border-radius:14px;background:#fff;color:#22223b;outline:none;user-select:text;-webkit-user-select:text;touch-action:auto;margin-bottom:6px}
.inp:focus{box-shadow:0 0 0 3px var(--sky)}
.err{min-height:20px;color:var(--pink);font-size:14px;margin-bottom:8px;text-align:center}
.plist-t{margin:16px 0 8px;font-size:14px;color:var(--muted);text-align:center}
.plist{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pchip{font-family:'Jua',sans-serif;font-size:15px;background:var(--panel);color:var(--ink);border:2px solid var(--line);border-radius:30px;padding:6px 12px;cursor:pointer}
.tabs{display:flex;gap:8px;max-width:640px;margin:0 auto 12px}
.tabs button{flex:1;font-family:'Black Han Sans',sans-serif;font-size:17px;padding:10px;border:3px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);cursor:pointer}
.tabs button.on{background:var(--sun);color:#22223b}
.rlist{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.rrow{display:flex;align-items:center;gap:10px;background:var(--card);border:3px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:0 3px 0 var(--shadow)}
.rrow.me{background:#fff4c2;color:#22223b}
.rrow .rk{font-family:'Black Han Sans',sans-serif;font-size:20px;width:36px;text-align:center}
.rrow .nm{flex:1;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .sc{font-size:15px;text-align:right;white-space:nowrap}
.rnote{max-width:640px;margin:0 auto 12px;background:var(--card);border:2px dashed var(--muted);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--muted);line-height:1.45}
.btn.danger{background:var(--pink);color:#fff}
.modes{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.mode-card{display:flex;align-items:center;gap:14px;text-align:left;width:100%;padding:16px;border:3px solid #22223b;border-radius:18px;background:var(--mc);color:#22223b;box-shadow:0 5px 0 #22223b;cursor:pointer;font-family:inherit}
.mode-card:active{transform:translateY(4px);box-shadow:0 1px 0 #22223b}
.mode-card .me{font-size:44px;line-height:1}
.mode-card b{display:block;font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:24px}
.mode-card small{display:block;font-size:15px;line-height:1.4;opacity:.85;margin-top:2px}
.mode-card em{display:inline-block;margin-top:8px;font-style:normal;background:#fff;border:2px solid #22223b;border-radius:10px;padding:2px 10px;font-size:14px}
.bignum{font-family:'Black Han Sans',sans-serif;font-size:48px;line-height:1.1;margin:4px 0 6px;color:var(--ink)}
.newrec{display:inline-block;background:var(--pink);color:#fff;border:2px solid #22223b;border-radius:10px;padding:2px 10px;font-size:15px;margin-bottom:8px;transform:rotate(-3deg)}
@media (prefers-reduced-motion:reduce){.card,.stars .on{animation:none}#toast{transition:none}}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>

  <div id="hud" class="hidden">
    <div class="hud-row">
      <button class="icon-btn" id="btnPause" aria-label="일시정지">⏸</button>
      <div class="chip" id="stageChip">🏢 1-1</div>
      <div class="grow"></div>
      <div class="chip hidden" id="modeStat"></div>
      <div class="chip" id="hearts">❤️❤️❤️</div>
      <div class="chip"><i class="coin-ic"></i> <span id="hudCoins">0</span></div>
    </div>
    <div class="prog"><div id="progFill"></div><span id="progFlag">🏁</span></div>
  </div>
  <div id="toast"></div>

  <section id="scrTitle" class="screen">
    <div style="display:flex;flex-direction:column;align-items:center">
      <div class="logo"><span class="w w1">병</span><span class="w w2">플립!</span></div>
      <div class="tag">사무실 · 집 · 공원 · 학교 — 60 스테이지</div>
      <div class="who" id="whoChip">👤</div>
    </div>
    <div class="menu">
      <button class="btn big" id="btnPlay">▶ 시작하기</button>
      <div class="row">
        <button class="btn mint" id="btnShop">🛍 병 상점</button>
        <button class="btn pink" id="btnRank">🏆 랭킹</button>
      </div>
      <div class="row">
        <button class="btn ghost" id="btnSound" aria-label="소리">🔊</button>
        <button class="btn ghost" id="btnSettings">⚙️ 계정</button>
      </div>
      <div class="coinline"><i class="coin-ic"></i> <span id="titleCoins">0</span></div>
    </div>
  </section>

  <section id="scrLogin" class="screen hidden">
    <div class="logo"><span class="w w1">병</span><span class="w w2">플립!</span></div>
    <div class="card login">
      <h3>이름으로 로그인</h3>
      <p>이름만 입력하면 끝! 기록이 저장되고 랭킹에 올라가요</p>
      <input class="inp" id="nameInput" maxlength="12" placeholder="이름 (최대 12자)" autocomplete="off" enterkeyhint="go">
      <div class="err" id="nameErr"></div>
      <button class="btn big" id="btnLogin">▶ 로그인</button>
      <div id="profWrap" class="hidden"><div class="plist-t">이 기기에 저장된 계정</div><div class="plist" id="profList"></div></div>
    </div>
  </section>

  <section id="scrRank" class="screen panel hidden">
    <div class="phead">
      <button class="icon-btn" id="rankBack" aria-label="뒤로">←</button>
      <h2>🏆 랭킹</h2>
    </div>
    <div class="scroll">
      <div class="tabs"><button data-rm="stage" class="on">⭐ 스테이지</button><button data-rm="far">📏 무한</button><button data-rm="t100">⏱ 100m</button></div>
      <div class="tabs"><button data-tab="online" class="on">🌐 전체</button><button data-tab="local">📱 이 기기</button></div>
      <div id="rankNote"></div>
      <div class="rlist" id="rankList"></div>
    </div>
  </section>

  <section id="scrMode" class="screen panel hidden">
    <div class="phead">
      <button class="icon-btn" id="modeBack" aria-label="뒤로">←</button>
      <h2>모드 선택</h2>
      <div class="chip"><i class="coin-ic"></i> <span id="modeCoins">0</span></div>
    </div>
    <div class="scroll"><div class="modes">
      <button class="mode-card" data-mode="stage" style="--mc:#8fb3ff"><span class="me">🗺</span><div><b>스테이지 모드</b><small>사무실 · 집 · 공원 · 학교 60 스테이지<br>하트 3개로 도전!</small><em id="mStage"></em></div></button>
      <button class="mode-card" data-mode="far" style="--mc:#7fdc8f"><span class="me">📏</span><div><b>무한 모드</b><small>한 번도 안 떨어지고 최대한 멀리!<br>유리문을 깨고 다음 장소로</small><em id="mFar"></em></div></button>
      <button class="mode-card" data-mode="random" style="--mc:#d8b4fe"><span class="me">🎲</span><div><b>맛보기 모드</b><small>골인 없이 끝없이 이어지는 랜덤 코스!<br>유리문 너머 랜덤 배경 · 랭킹 없음</small><em>할 때마다 새 코스</em></div></button>
      <button class="mode-card" data-mode="t100" style="--mc:#ffb27a"><span class="me">⏱</span><div><b>100m 타임어택</b><small>한 번도 안 떨어지고 100m를 최대한 빨리!<br>25m마다 유리문</small><em id="mT100"></em></div></button>
    </div></div>
  </section>

  <section id="scrMap" class="screen panel hidden">
    <div class="phead">
      <button class="icon-btn" id="mapBack" aria-label="뒤로">←</button>
      <h2>스테이지 선택</h2>
      <button class="icon-btn" id="mapShop" aria-label="상점">🛍</button>
      <div class="chip"><i class="coin-ic"></i> <span id="mapCoins">0</span></div>
    </div>
    <div class="scroll" id="mapList"></div>
  </section>

  <section id="scrShop" class="screen panel hidden">
    <div class="phead">
      <button class="icon-btn" id="shopBack" aria-label="뒤로">←</button>
      <h2>병 상점</h2>
      <div class="chip"><i class="coin-ic"></i> <span id="shopCoins">0</span></div>
    </div>
    <div class="scroll"><div class="shopgrid" id="shopGrid"></div></div>
  </section>

  <div id="modal" class="modal hidden"><div class="card" id="modalCard"></div></div>
</div>

<script>
(() => {
'use strict';
/* ================= CONFIG ================= */
const TAU = Math.PI * 2;
const FLOOR = 640, G = 2600, HALF = 35;

  { id: 'cider',  name: '사이다',     price: 180,  glass: 'rgba(120,230,150,.35)', liq: '#dfffe6', cap: '#15a04a', label: '#15a04a', lt: '#fff', text: 'CIDER' },
  { id: 'milk',   name: '급식 우유',  price: 250,  glass: 'rgba(255,255,255,.75)', liq: '#fffaf0', cap: '#3b8cff', label: '#3b8cff', lt: '#fff', text: '우유' },
  { id: 'straw',  name: '딸기 우유',  price: 320,  glass: 'rgba(255,220,235,.6)', liq: '#ff9ec4', cap: '#ff4f93', label: '#ffffff', lt: '#ff4f93', text: '딸기' },
  { id: 'banana', name: '바나나 우유', price: 400,  glass: 'rgba(255,245,200,.6)', liq: '#ffe066', cap: '#f2a900', label: '#ffffff', lt: '#e08a00', text: '바나나' },
  { id: 'orange', name: '오렌지 주스', price: 520,  glass: 'rgba(255,220,180,.4)', liq: '#ff9a1f', cap: '#3ea34a', label: '#ffffff', lt: '#ff7a00', text: '100%' },
  { id: 'grape',  name: '포도 주스',  price: 680,  glass: 'rgba(200,170,255,.38)', liq: '#6a2fb0', cap: '#4a1d80', label: '#b58cff', lt: '#fff', text: 'GRAPE' },

  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  closeModal(); showScreen(null); mode = 'play';
  if (seed === undefined) seed = kind === 't100' ? 777001 : (Math.random() * 1e9) | 0;   // 100m는 고정 코스 (기록 공정성)
  cur.g = newGen(seed); cur.rseed = seed;
  const th0 = kind === 'random' ? THEME_CYCLE[Math.floor(cur.g.rnd() * 4)] : THEME_CYCLE[0];
  cur.mode = kind; cur.stage = -1; cur.zoneI = 0; cur.theme = th0; cur.zoneTheme = th0;
  cur.zoneLen = (kind === 'far' ? 40 : kind === 'random' ? 30 : 25) * PXM; cur.startX = 110; cur.nextZoneX = cur.startX + cur.zoneLen;
  cur.doors = []; cur.zones = [{ x: -1e9, theme: th0 }];
  cur.g.plats[0].theme = th0; cur.g.plats[0].idx = 0;
  if (kind === 't100') {
    while (true) { const l = cur.g.plats[cur.g.plats.length - 1]; if (l.x + l.w - cur.startX >= 100 * PXM - 260) break; runGenNext(false); }
    runGenNext(true);
  } else { for (let i = 0; i < 12; i++) runGenNext(false); }
  cur.plats = cur.g.plats; cur.coins = cur.g.coins;
  cur.lives = 1; cur.fails = 0; cur.lost = 0; cur.earned = 0; cur.lastSafe = 0; cur.best = 0;
  cur.distM = 0; cur.tStart = null; cur.finalT = 0; cur.flash = 0; cur.shake = 0;
  particles = []; popups = [];
  standOn(cur.plats[0], 0); B.landOff = 0; B.slosh = 0;
  updateCam(0, true); updHUD();
  toast(kind === 'far' ? '📏 한 번도 안 떨어지고 최대한 멀리! 유리문을 깨면 다음 장소로 넘어가요'
    : kind === 'random' ? '🎲 끝없는 랜덤 코스! 유리문 너머엔 어떤 장소가 나올까요? (랭킹 없음)'
    : '⏱ 첫 점프부터 시간 측정! 한 번도 안 떨어지고 100m까지', 3200);
}
function updateRun() {
  // 유리문 통과 체크
  for (const d of cur.doors) if (!d.broken && B.x >= d.x) breakDoor(d);
  if (cur.mode !== 'far' && cur.mode !== 'random') return;
  // 무한 생성 + 뒤쪽 정리
  const g = cur.g;
  while (g.plats[g.plats.length - 1].x < B.x + 3000) runGenNext(false);
  if (g.plats.length > 50) {
    const cut = B.x - 2200;
    g.plats = g.plats.filter(p => p.x + p.w > cut || p === B.plat); cur.plats = g.plats;
    g.coins = g.coins.filter(c => c.x > cut); cur.coins = g.coins;
    cur.doors = cur.doors.filter(d => d.x > cut);
    while (cur.zones.length > 2 && cur.zones[1].x < cut) cur.zones.shift();
  }
}
function breakDoor(d) {
  d.broken = true; cur.theme = d.theme; cur.flash = 1; cur.shake = 0.35;
  SFX.glass(); vib(35);
  for (let i = 0; i < 36; i++) particles.push({ x: d.x + (Math.random() - .5) * 20, y: FLOOR - Math.random() * 600, vx: 120 + Math.random() * 380, vy: (Math.random() - .7) * 500, life: 1.5, max: 1.5, size: 7 + Math.random() * 14, color: 'rgba(185,232,255,.9)', type: 'shard', grav: .9, rot: Math.random() * TAU, vr: (Math.random() - .5) * 16 });
  for (let i = 0; i < 18; i++) particles.push({ x: B.x, y: B.y + (Math.random() - .5) * 60, vx: (Math.random() - .2) * 500, vy: (Math.random() - .6) * 500, life: 1.1, max: 1.1, size: 4 + Math.random() * 6, color: 'rgba(220,245,255,.95)', type: 'shard', grav: .8, rot: Math.random() * TAU, vr: (Math.random() - .5) * 20 });
  const wd = WORLDS.find(w => w.id === d.theme);
  popup(B.x, B.y - 120, `${wd.emoji} ${wd.name}!`, '#4d9de0');
  updHUD();
}
function showRunOver() {
  if (cur.mode === 'random') {
    const m = cur.distM, reward = Math.floor(m / 8) + cur.earned;
    save.coins += reward; persist();   // 랭킹/최고기록 저장 안 함
    openModal(`<div class="em">🎲</div><h3>맛보기 끝!</h3><div class="bignum">${m.toFixed(1)}m</div>
    <p>문 ${cur.doors.filter(d => d.broken).length}개 돌파 · 맛보기는 랭킹에 기록되지 않아요</p>
    <div class="rw"><div><span>거리 보상 (8m당 1)</span><b>+${Math.floor(m / 8)}</b></div><div><span>획득 코인</span><b>+${cur.earned}</b></div><div class="tot"><span>합계</span><b><i class="coin-ic"></i> ${reward}</b></div></div>
    <div class="mbtns"><button class="btn big" data-act="again">🎲 새 랜덤 코스</button><button class="btn mint" data-act="modes">모드 선택</button></div>`);
    return;
  }
  if (cur.mode === 'far') {
    const m = cur.distM, rec = m > save.best.far + 1e-9, reward = Math.floor(m / 4) + cur.earned;
    if (rec) save.best.far = m;
    save.coins += reward; persist(); pushScore();
    openModal(`<div class="em">📏</div>${rec && m > 0 ? '<div class="newrec">🎉 신기록!</div>' : ''}<h3>여기까지!</h3>
    <div class="bignum">${m.toFixed(1)}m</div><p>최고 기록 ${save.best.far.toFixed(1)}m</p>
    <div class="rw"><div><span>거리 보상 (4m당 1)</span><b>+${Math.floor(m / 4)}</b></div><div><span>획득 코인</span><b>+${cur.earned}</b></div><div class="tot"><span>합계</span><b><i class="coin-ic"></i> ${reward}</b></div></div>
    <div class="mbtns"><button class="btn big" data-act="again">↻ 다시 도전</button><button class="btn mint" data-act="modes">모드 선택</button></div>`);
  } else {
    openModal(`<div class="em">💦</div><h3>떨어졌어요!</h3><div class="bignum">${Math.min(100, cur.distM).toFixed(0)}m</div>
    <p>100m 타임어택은 한 번도 떨어지면 안 돼요.<br>최고 기록 ${save.best.t100 ? save.best.t100.toFixed(2) + '초' : '없음'}</p>
    <div class="mbtns"><button class="btn big" data-act="again">↻ 다시 도전</button><button class="btn mint" data-act="modes">모드 선택</button></div>`);
  }
}
function showT100Finish() {
  const t = cur.finalT, rec = !save.best.t100 || t < save.best.t100, reward = 40 + (rec ? 20 : 0) + cur.earned;
  if (rec) save.best.t100 = t;
  save.coins += reward; persist(); pushScore();
  openModal(`<div class="em">⏱</div>${rec ? '<div class="newrec">🎉 신기록!</div>' : ''}<h3>100m 완주!</h3>
  <div class="bignum">${t.toFixed(2)}초</div><p>최고 기록 ${save.best.t100.toFixed(2)}초</p>
  <div class="rw"><div><span>완주 보상</span><b>+40</b></div>${rec ? '<div><span>신기록 보너스</span><b>+20</b></div>' : ''}<div><span>획득 코인</span><b>+${cur.earned}</b></div><div class="tot"><span>합계</span><b><i class="coin-ic"></i> ${reward}</b></div></div>
  <div class="mbtns"><button class="btn big" data-act="again">↻ 다시 도전</button><button class="btn mint" data-act="modes">모드 선택</button></div>`);
}
/* ================= 맛보기(랜덤) 모드: 랭킹 없음 ================= */
function startRandom(seed) { startRun('random', seed); }
function toModes() {
  closeModal(); if (mode !== 'menu') { mode = 'menu'; setupDemo(); updateCam(0, true); }
  coinsUI();
  const st = statOf(save);
  $('mStage').textContent = `⭐ ${st.stars} · 클리어 ${st.cleared}/${TOTAL}`;
  $('mFar').textContent = `최고 ${save.best.far.toFixed(1)}m`;
  $('mT100').textContent = save.best.t100 ? `최고 ${save.best.t100.toFixed(2)}초` : '기록 없음';
  showScreen('scrMode');
}
function toMap() {
  closeModal(); if (mode !== 'menu') { mode = 'menu'; setupDemo(); updateCam(0, true); }
  coinsUI(); buildMap(); showScreen('scrMap');
}
function toShop(from) { shopBack = from; coinsUI(); buildShop(); showScreen('scrShop'); }
function buildMap() {
  const el = $('mapList'); el.innerHTML = '';
  let curEl = null;
  WORLDS.forEach((wd, wi) => {
    const sec = document.createElement('div'); sec.className = 'world'; sec.style.setProperty('--wc', wd.color);
    let cl = 0; for (let l = 0; l < PER; l++) if (save.stars[wi * PER + l]) cl++;
    sec.innerHTML = `<div class="whead"><span class="em">${wd.emoji}</span><div><b>${wd.name}</b><small>${wd.desc}</small></div><span class="wp">${cl}/${PER}</span></div><div class="grid"></div>`;
    const grid = sec.querySelector('.grid');
    for (let l = 0; l < PER; l++) {
      const s = wi * PER + l, un = isOpen(s), st = save.stars[s] || 0;
      const b = document.createElement('button'); b.className = 'stg' + (!un ? ' locked' : st ? ' done' : ' cur');
      const fee = save.lock && save.lock[s], rl = save.runs && save.runs[s];
      b.innerHTML = un ? `<b>${l + 1}</b><span class="st">${fee ? '💰' + RETRY_FEE : rl ? '❤️'.repeat(rl) : '★'.repeat(st) + '☆'.repeat(3 - st)}</span>` : '<b>🔒</b>';
      b.setAttribute('aria-label', `${wd.name} ${l + 1}스테이지${un ? '' : ' 잠김'}`);
      if (un) b.onclick = () => { SFX.click(); tryPlay(s); }; else b.disabled = true;
      if (!curEl && un && !st) curEl = sec;
      grid.appendChild(b);
    }
    el.appendChild(sec);
  });
  if (curEl) requestAnimationFrame(() => { el.scrollTop = Math.max(0, curEl.offsetTop - 70); });
}
let shopPrev = [];
function animShop() {
  if ($('scrShop').classList.contains('hidden')) return;
  for (const { c2, sk } of shopPrev) { c2.clearRect(0, 0, 110, 130); drawBottle(c2, sk, 55, 72, 0, 1.4, T, 0); }
}
function buildShop() {
  const g = $('shopGrid'); g.innerHTML = ''; const dpr = Math.min(2, window.devicePixelRatio || 1);
  shopPrev = [];
  SKINS.slice().sort((x, y) => x.price - y.price).forEach(sk => {
    const owned = save.owned.includes(sk.id), on = save.skin === sk.id;
    const card = document.createElement('div'); card.className = 'skin' + (on ? ' on' : '');
    const pc = document.createElement('canvas'); pc.width = 110 * dpr; pc.height = 130 * dpr;
    const c2 = pc.getContext('2d'); c2.scale(dpr, dpr); drawBottle(c2, sk, 55, 72, 0, 1.4, 0.6, 0); if (sk.fx || sk.special) shopPrev.push({ c2, sk });
    const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = sk.name;
    const bt = document.createElement('button'); bt.className = 'btn' + (on ? ' ghost' : owned ? ' mint' : '');
    bt.innerHTML = on ? '장착 중' : owned ? '장착하기' : `<i class="coin-ic"></i> ${sk.price}`;
    if (!owned && save.coins < sk.price) bt.disabled = true;
    bt.onclick = () => {
      if (on) return;
      if (!owned) { if (save.coins < sk.price) return; save.coins -= sk.price; save.owned.push(sk.id); SFX.coin(); toast(`${sk.name} 구매 완료!`, 1400); }
      else SFX.click();
      save.skin = sk.id; persist(); coinsUI(); buildShop();
    };
    card.append(pc, nm, bt); g.appendChild(card);
  });
}
function soundIcon() { $('btnSound').textContent = save.sound ? '🔊' : '🔇'; }
function toast(msg, ms) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), ms || 2400); }

$('btnPlay').onclick = () => { ac(); SFX.click(); toModes(); };
$('modeBack').onclick = () => { SFX.click(); toTitle(); };
document.querySelectorAll('.mode-card').forEach(b => b.onclick = () => { ac(); SFX.click(); const m = b.dataset.mode; if (m === 'stage') toMap(); else if (m === 'random') startRandom(); else startRun(m); });
$('btnShop').onclick = () => { ac(); SFX.click(); toShop('title'); };
$('mapShop').onclick = () => { SFX.click(); toShop('map'); };
$('btnSound').onclick = () => { save.sound = !save.sound; persist(); soundIcon(); ac(); SFX.click(); };
$('mapBack').onclick = () => { SFX.click(); toModes(); };
$('shopBack').onclick = () => { SFX.click(); shopBack === 'map' ? toMap() : toTitle(); };
$('btnRank').onclick = () => { SFX.click(); toRank(); };
$('rankBack').onclick = () => { SFX.click(); toTitle(); };
document.querySelectorAll('.tabs button[data-tab]').forEach(b => b.onclick = () => { SFX.click(); rankTab = b.dataset.tab; renderRank(); });
document.querySelectorAll('.tabs button[data-rm]').forEach(b => b.onclick = () => { SFX.click(); rankMode = b.dataset.rm; renderRank(); });
$('btnSettings').onclick = () => { SFX.click(); openSettings(); };
$('btnLogin').onclick = () => doLogin($('nameInput').value);
$('nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin($('nameInput').value); });
$('btnPause').onclick = () => { SFX.click(); pauseGame(); };
cv.addEventListener('pointerdown', e => { e.preventDefault(); onTap(); });
const isTyping = e => e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA');
const isJumpKey = e => e.code === 'Space' || e.key === ' ' || e.code === 'ArrowUp' || e.code === 'KeyW';
// 캡처 단계에서 가로채서, 포커스된 버튼이 스페이스로 눌리는 것까지 막음
window.addEventListener('keydown', e => {
  if (isTyping(e)) return;
  if (isJumpKey(e) && mode === 'play') {
    e.preventDefault(); e.stopPropagation();
    if (!e.repeat) onTap();
    return;
  }
  if (e.code === 'Escape' || e.code === 'KeyP') { if (mode === 'play') pauseGame(); else if (mode === 'paused') { closeModal(); mode = 'play'; last = performance.now(); } }
}, true);
window.addEventListener('keyup', e => {
  if (isTyping(e)) return;
  if (isJumpKey(e) && (mode === 'play' || mode === 'result')) { e.preventDefault(); e.stopPropagation(); }
}, true);
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
document.addEventListener('gesturestart', e => e.preventDefault());

// demo theme cycling on title
setInterval(() => { if (mode === 'menu' && B.state === 'stand') { demo.theme++; setupDemo(); } }, 5200);

soundIcon(); if (store.current && store.profiles[store.current]) toTitle(); else toLogin();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (!$('scrShop').classList.contains('hidden')) buildShop(); });
requestAnimationFrame(t => { last = t; requestAnimationFrame(loop); });
})();
</script>
